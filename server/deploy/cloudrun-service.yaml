apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __CLOUD_RUN_SERVICE_NAME__
  labels:
    cloud.googleapis.com/location: __REGION__
    app: passkey-server
  annotations:
    # Cloud Run IAM authentication is required. Do not grant allUsers run.invoker.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/network-interfaces: '[{"network":"__VPC_NETWORK__","subnetwork":"__VPC_SUBNET__"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
        # cloud-sql-proxy becomes healthy first; app starts afterward. Shutdown is the reverse order.
        run.googleapis.com/container-dependencies: '{"app":["cloud-sql-proxy"]}'
    spec:
      serviceAccountName: __SERVER_SA_NAME__@__GCP_PROJECT_ID__.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.3
          args:
            - --auto-iam-authn
            - --private-ip
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - --structured-logs
            - __GCP_PROJECT_ID__:__REGION__:__CLOUD_SQL_INSTANCE__
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          resources:
            limits:
              cpu: "0.25"
              memory: 128Mi
        - name: app
          image: __REGION__-docker.pkg.dev/__GCP_PROJECT_ID__/__ARTIFACT_REPOSITORY__/__IMAGE_NAME__:__IMAGE_TAG__
          command: ["/usr/local/bin/passkey-server"]
          args: ["serve"]
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: RP_ID
              value: __RP_ID__
            - name: ORIGIN
              value: __ORIGIN__
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: DATABASE_HOST
              value: 127.0.0.1
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: __DATABASE_NAME__
            # IAM database user for the Cloud Run service account. Cloud SQL Proxy performs IAM authn.
            - name: DATABASE_USER
              value: __SERVER_SA_NAME__@__GCP_PROJECT_ID__.iam
            - name: MAILGUN_DOMAIN
              value: __MAILGUN_DOMAIN__
            - name: MAILGUN_API_BASE_URL
              value: __MAILGUN_API_BASE_URL__
            - name: MAIL_FROM
              value: __MAIL_FROM__
            - name: MAILGUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __MAILGUN_SECRET_NAME__
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
  traffic:
    - percent: 100
      latestRevision: true
