substitutions:
  _REGION: REGION
  _PROJECT_ID: PROJECT_ID
  _IMAGE_TAG: $COMMIT_SHA
  _VPC_NETWORK: VPC_NETWORK
  _VPC_SUBNET: VPC_SUBNET
  _CLOUD_SQL_INSTANCE: CLOUD_SQL_INSTANCE
  _MAILGUN_DOMAIN: MAILGUN_DOMAIN
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/passkey/server:${_IMAGE_TAG}
      - --file
      - server/Containerfile
      - --push
      - server
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        sed -e "s/PROJECT_ID/${_PROJECT_ID}/g" \
            -e "s/REGION/${_REGION}/g" \
            -e "s/IMAGE_TAG/${_IMAGE_TAG}/g" \
            -e "s/VPC_NETWORK/${_VPC_NETWORK}/g" \
            -e "s/VPC_SUBNET/${_VPC_SUBNET}/g" \
            -e "s/CLOUD_SQL_INSTANCE/${_CLOUD_SQL_INSTANCE}/g" \
            -e "s/MAILGUN_DOMAIN/${_MAILGUN_DOMAIN}/g" \
            server/deploy/cloudrun-migrate-job.yaml > /tmp/migrate-job.yaml
        gcloud run jobs replace /tmp/migrate-job.yaml --region "${_REGION}"
        gcloud run jobs execute passkey-migrate --region "${_REGION}" --wait
        sed -e "s/PROJECT_ID/${_PROJECT_ID}/g" \
            -e "s/REGION/${_REGION}/g" \
            -e "s/IMAGE_TAG/${_IMAGE_TAG}/g" \
            -e "s/VPC_NETWORK/${_VPC_NETWORK}/g" \
            -e "s/VPC_SUBNET/${_VPC_SUBNET}/g" \
            -e "s/CLOUD_SQL_INSTANCE/${_CLOUD_SQL_INSTANCE}/g" \
            -e "s/MAILGUN_DOMAIN/${_MAILGUN_DOMAIN}/g" \
            server/deploy/cloudrun-service.yaml > /tmp/service.yaml
        gcloud run services replace /tmp/service.yaml --region "${_REGION}"
        sed -e "s/PROJECT_ID/${_PROJECT_ID}/g" \
            -e "s/REGION/${_REGION}/g" \
            -e "s/IMAGE_TAG/${_IMAGE_TAG}/g" \
            -e "s/VPC_NETWORK/${_VPC_NETWORK}/g" \
            -e "s/VPC_SUBNET/${_VPC_SUBNET}/g" \
            -e "s/CLOUD_SQL_INSTANCE/${_CLOUD_SQL_INSTANCE}/g" \
            server/deploy/cloudrun-cleanup-job.yaml > /tmp/cleanup-job.yaml
        gcloud run jobs replace /tmp/cleanup-job.yaml --region "${_REGION}"
