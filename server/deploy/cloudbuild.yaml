# Normal application deployment. Edit the substitution values below before the first use.
# __GCP_PROJECT_ID__ is the only value that must always be replaced.
substitutions:
  _GCP_PROJECT_ID: __GCP_PROJECT_ID__
  _REGION: asia-northeast1
  _ARTIFACT_REPOSITORY: passkey
  _IMAGE_NAME: server
  _VPC_NETWORK: passkey-vpc
  _VPC_SUBNET: passkey-subnet
  _CLOUD_SQL_INSTANCE: passkey-postgres
  _DATABASE_NAME: passkey
  _MAILGUN_SECRET_NAME: mailgun-api-key
  _CLOUD_RUN_SERVICE_NAME: passkey-server
  _MIGRATE_JOB_NAME: passkey-migrate
  _CLEANUP_JOB_NAME: passkey-cleanup
  _SERVER_SA_NAME: passkey-server
  _MIGRATOR_SA_NAME: passkey-migrator
  _SCHEDULER_SA_NAME: passkey-scheduler
  _WEB_PROXY_SA_NAME: passkey-web-proxy
  _CLOUD_BUILD_SA_NAME: passkey-cloudbuild
  _RP_ID: passkey.kantacky.com
  _ORIGIN: https://passkey.kantacky.com
  _MAILGUN_DOMAIN: mail.passkey.kantacky.com
  _MAILGUN_API_BASE_URL: https://api.mailgun.net
  _MAIL_FROM: no-reply@mail.passkey.kantacky.com
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_CLOUD_BUILD_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: validate-config
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        if [[ "${_GCP_PROJECT_ID}" == "__GCP_PROJECT_ID__" ]]; then
          echo "Edit server/deploy/cloudbuild.yaml and replace __GCP_PROJECT_ID__." >&2
          exit 1
        fi
        if [[ "${PROJECT_ID}" != "${_GCP_PROJECT_ID}" ]]; then
          echo "gcloud target project '${PROJECT_ID}' does not match _GCP_PROJECT_ID '${_GCP_PROJECT_ID}'." >&2
          echo "Run: gcloud config set project ${_GCP_PROJECT_ID}" >&2
          exit 1
        fi

  - name: gcr.io/cloud-builders/docker
    id: build-and-push-image
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --tag
      - ${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
      - --file
      - server/Containerfile
      - --push
      - server

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: render-cloud-run-manifests
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        mkdir -p /workspace/.deploy-rendered
        for manifest in cloudrun-migrate-job.yaml cloudrun-service.yaml cloudrun-cleanup-job.yaml; do
          sed \
            -e 's|__GCP_PROJECT_ID__|${_GCP_PROJECT_ID}|g' \
            -e 's|__REGION__|${_REGION}|g' \
            -e 's|__ARTIFACT_REPOSITORY__|${_ARTIFACT_REPOSITORY}|g' \
            -e 's|__IMAGE_NAME__|${_IMAGE_NAME}|g' \
            -e 's|__IMAGE_TAG__|${BUILD_ID}|g' \
            -e 's|__VPC_NETWORK__|${_VPC_NETWORK}|g' \
            -e 's|__VPC_SUBNET__|${_VPC_SUBNET}|g' \
            -e 's|__CLOUD_SQL_INSTANCE__|${_CLOUD_SQL_INSTANCE}|g' \
            -e 's|__DATABASE_NAME__|${_DATABASE_NAME}|g' \
            -e 's|__CLOUD_RUN_SERVICE_NAME__|${_CLOUD_RUN_SERVICE_NAME}|g' \
            -e 's|__MIGRATE_JOB_NAME__|${_MIGRATE_JOB_NAME}|g' \
            -e 's|__CLEANUP_JOB_NAME__|${_CLEANUP_JOB_NAME}|g' \
            -e 's|__SERVER_SA_NAME__|${_SERVER_SA_NAME}|g' \
            -e 's|__MIGRATOR_SA_NAME__|${_MIGRATOR_SA_NAME}|g' \
            -e 's|__RP_ID__|${_RP_ID}|g' \
            -e 's|__ORIGIN__|${_ORIGIN}|g' \
            -e 's|__MAILGUN_SECRET_NAME__|${_MAILGUN_SECRET_NAME}|g' \
            -e 's|__MAILGUN_DOMAIN__|${_MAILGUN_DOMAIN}|g' \
            -e 's|__MAILGUN_API_BASE_URL__|${_MAILGUN_API_BASE_URL}|g' \
            -e 's|__MAIL_FROM__|${_MAIL_FROM}|g' \
            "server/deploy/$${manifest}" > "/workspace/.deploy-rendered/$${manifest}"
        done

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate-database
    script: |
      gcloud run jobs replace /workspace/.deploy-rendered/cloudrun-migrate-job.yaml --region "${_REGION}" --project "${_GCP_PROJECT_ID}"
      gcloud run jobs execute "${_MIGRATE_JOB_NAME}" --region "${_REGION}" --project "${_GCP_PROJECT_ID}" --wait

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-service
    script: |
      gcloud run services replace /workspace/.deploy-rendered/cloudrun-service.yaml --region "${_REGION}" --project "${_GCP_PROJECT_ID}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cleanup-job
    script: |
      gcloud run jobs replace /workspace/.deploy-rendered/cloudrun-cleanup-job.yaml --region "${_REGION}" --project "${_GCP_PROJECT_ID}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: bind-resource-invokers
    script: |
      gcloud run services add-iam-policy-binding "${_CLOUD_RUN_SERVICE_NAME}" \
        --region "${_REGION}" \
        --project "${_GCP_PROJECT_ID}" \
        --member "serviceAccount:${_WEB_PROXY_SA_NAME}@${_GCP_PROJECT_ID}.iam.gserviceaccount.com" \
        --role roles/run.invoker
      gcloud run jobs add-iam-policy-binding "${_CLEANUP_JOB_NAME}" \
        --region "${_REGION}" \
        --project "${_GCP_PROJECT_ID}" \
        --member "serviceAccount:${_SCHEDULER_SA_NAME}@${_GCP_PROJECT_ID}.iam.gserviceaccount.com" \
        --role roles/run.invoker
