# Normal application deployment. Terraform owns the infrastructure; this build
# only builds the image, runs migrations, and updates the Cloud Run service/jobs.
# Cloud Build selects the build identity before running steps, so this field cannot
# read infra/terraform.tfvars. Keep cloudbuild_service_account_name in tfvars set to
# passkey-cloudbuild, or update this field at the same time.
serviceAccount: projects/$PROJECT_ID/serviceAccounts/passkey-cloudbuild@$PROJECT_ID.iam.gserviceaccount.com
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  # Expose built-in substitutions (PROJECT_ID, BUILD_ID) as env vars inside `script:` steps.
  automapSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
steps:
  # The cloud-sdk image does not ship python3, so tfvars parsing and manifest
  # rendering run in a python image and hand results over via /workspace.
  - name: python:3.13-slim
    id: load-config
    script: |
      set -eu
      python3 server/deploy/deploy_config.py export infra/terraform.tfvars /workspace/.deploy-env
      python3 server/deploy/deploy_config.py render infra/terraform.tfvars "${BUILD_ID}" /workspace/.deploy-rendered

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: validate-config
    script: |
      set -eu
      . /workspace/.deploy-env

      if [ "${PROJECT_ID}" != "$$TF_PROJECT_ID" ]; then
        echo "gcloud target project '${PROJECT_ID}' does not match project_id '$$TF_PROJECT_ID' in infra/terraform.tfvars." >&2
        echo "Run: gcloud config set project $$TF_PROJECT_ID" >&2
        exit 1
      fi

      if ! gcloud run services describe "$$TF_CLOUD_RUN_SERVICE_NAME" --region "$$TF_REGION" --project "$$TF_PROJECT_ID" >/dev/null 2>&1; then
        echo "Cloud Run service '$$TF_CLOUD_RUN_SERVICE_NAME' does not exist. Run terraform apply first." >&2
        exit 1
      fi
      for job in "$$TF_MIGRATE_JOB_NAME" "$$TF_CLEANUP_JOB_NAME"; do
        if ! gcloud run jobs describe "$$job" --region "$$TF_REGION" --project "$$TF_PROJECT_ID" >/dev/null 2>&1; then
          echo "Cloud Run job '$$job' does not exist. Run terraform apply first." >&2
          exit 1
        fi
      done

  - name: gcr.io/cloud-builders/docker
    id: build-and-push-image
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        . /workspace/.deploy-env
        image="$${TF_REGION}-docker.pkg.dev/$${TF_PROJECT_ID}/$${TF_ARTIFACT_REPOSITORY}/$${TF_IMAGE_NAME}:${BUILD_ID}"
        docker buildx build \
          --platform=linux/amd64 \
          --tag "$$image" \
          --file server/Containerfile \
          --push \
          server

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate-database
    script: |
      set -eu
      . /workspace/.deploy-env
      gcloud run jobs replace /workspace/.deploy-rendered/cloudrun-migrate-job.yaml \
        --region "$$TF_REGION" \
        --project "$$TF_PROJECT_ID"
      gcloud run jobs execute "$$TF_MIGRATE_JOB_NAME" \
        --region "$$TF_REGION" \
        --project "$$TF_PROJECT_ID" \
        --wait

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-service
    script: |
      set -eu
      . /workspace/.deploy-env
      gcloud run services replace /workspace/.deploy-rendered/cloudrun-service.yaml \
        --region "$$TF_REGION" \
        --project "$$TF_PROJECT_ID"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cleanup-job
    script: |
      set -eu
      . /workspace/.deploy-env
      gcloud run jobs replace /workspace/.deploy-rendered/cloudrun-cleanup-job.yaml \
        --region "$$TF_REGION" \
        --project "$$TF_PROJECT_ID"
