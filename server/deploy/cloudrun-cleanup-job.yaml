apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: __CLEANUP_JOB_NAME__
  labels:
    cloud.googleapis.com/location: __REGION__
    app: passkey-server
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/network-interfaces: '[{"network":"__VPC_NETWORK__","subnetwork":"__VPC_SUBNET__"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/container-dependencies: '{"cleanup":["cloud-sql-proxy"]}'
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: __SERVER_SA_NAME__@__GCP_PROJECT_ID__.iam.gserviceaccount.com
          containers:
            - name: cloud-sql-proxy
              image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.3
              args:
                - --auto-iam-authn
                - --private-ip
                - --health-check
                - --http-address=0.0.0.0
                - --http-port=9090
                - --admin-port=9091
                - --quitquitquit
                - --exit-zero-on-sigterm
                - --structured-logs
                - __GCP_PROJECT_ID__:__REGION__:__CLOUD_SQL_INSTANCE__
              startupProbe:
                httpGet:
                  path: /startup
                  port: 9090
                periodSeconds: 1
                timeoutSeconds: 1
                failureThreshold: 30
            - name: cleanup
              image: __REGION__-docker.pkg.dev/__GCP_PROJECT_ID__/__ARTIFACT_REPOSITORY__/__IMAGE_NAME__:__IMAGE_TAG__
              command: ["/bin/sh", "-c"]
              args:
                - |
                  /usr/local/bin/passkey-server cleanup
                  code=$?
                  curl -fsS -X POST http://127.0.0.1:9091/quitquitquit || true
                  exit $code
              env:
                - name: DATABASE_HOST
                  value: 127.0.0.1
                - name: DATABASE_PORT
                  value: "5432"
                - name: DATABASE_NAME
                  value: __DATABASE_NAME__
                - name: DATABASE_USER
                  value: __SERVER_SA_NAME__@__GCP_PROJECT_ID__.iam
          timeoutSeconds: 600
          maxRetries: 1
